name: 기능 / 컴포넌트
description: 기능이나 컴포넌트를 추가한다
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 왜 필요한가. 2곳 이상에서 실제로 필요했던 근거를 적는다
    validations:
      required: true
  - type: checkboxes
    id: ladder
    attributes:
      label: 만들기 전 확인
      description: 앞에서 해결되면 새로 만들지 않는다
      options:
        - label: SLDS base component(`lightning-*`)로는 안 된다
        - label: org 테마 또는 브랜드 root style로는 안 된다
        - label: 이미 밀버스에 비슷한 컴포넌트가 없다
  - type: textarea
    id: tasks
    attributes:
      label: 할 일
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      value: |
        - [ ] 스토리(기본 / 변형 / 브랜드별)
        - [ ] 사용 기준 문서(언제 쓰는지 / 언제 쓰면 안 되는지)
        - [ ] Jest 테스트
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: 참고
